# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-oauth"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The OAuth self-minting auth styles (jwt-bearer, oauth-client-credentials), as one auth-kind plugin on the auth kind's memory ABI."

# MOVED from busbar (crates/busbar-auth-oauth at busbar bb0c7f71d4, history imported;
# BUSBAR-1.6.0.md §9: every plugin lives in its own repo). The source is busbar's verbatim.

[lib]
# rlib only: the LINKED door (`busbar_auth_oauth::door`, the `DoorFn` a compiled-in row holds) and the
# tests. The DROPPED door is the sibling `busbar-auth-oauth-plugin` cdylib, the same door behind the
# one exported symbol.
crate-type = ["rlib"]

# DEPENDENCY POLICY. A plugin's closure is `busbar-contract` plus the third-party crates it needs to
# do its job (owner ruling 2026-09-28, PLUGIN LIBRARIES): the RFC 7523 RS256 signature (`ring`,
# `base64`), the token response (`serde`, `serde_json`), the
# status line a mint failure names (the `http` crate), and the cache key hash (`sha2`). No kernel
# crate, no plane, no sibling auth-kind plugin.
# Every version is the workspace table's (busbar's at the pin).
[dependencies]
busbar-contract = { workspace = true, features = ["chip-jws"] }
base64 = { workspace = true }
http = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Key material and token bodies are wiped on drop (BUSBAR-1.6.0.md THE DESIGN §6: "auth material is
# zeroised").
zeroize = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# The token request forms are written by the crate's own encoder (`mint::form`, sized once and wiped
# on drop); the tests read them back, and hold the encoder to `serde_urlencoded`'s bytes.
serde_urlencoded = { workspace = true }
# The chip's sealed values read back in tests (dev-only test support).
busbar-contract = { workspace = true, features = ["chip-jws", "test-seal"] }
