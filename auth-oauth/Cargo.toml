# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-oauth"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The OAuth self-minting auth styles (jwt-bearer, oauth-client-credentials), as one auth-kind plugin on the auth kind's memory ABI."

# MOVED from busbar (crates/busbar-auth-oauth at busbar bb0c7f71d4, history imported;
# BUSBAR-1.6.0.md §9: every plugin lives in its own repo). The source is busbar's verbatim.

[lib]
# rlib only: the LINKED door (`busbar_auth_oauth::door`, the `DoorFn` a compiled-in row holds) and the
# tests. The DROPPED door is the sibling `busbar-auth-oauth-plugin` cdylib, the same door behind the
# one exported symbol.
crate-type = ["rlib"]

# DEPENDENCY POLICY. A plugin's closure is `busbar-contract` plus the third-party crates it needs to
# do its job (owner ruling 2026-09-28, PLUGIN LIBRARIES): the RFC 7523 assertion's base64url and
# its PEM key's DER (`base64`; the chip signs it), the token response (`serde`, `serde_json`), the
# status line a mint failure names (the `http` crate), the cache key's random key (`ring`) and a
# token-exchange scope's key (`sha2`). No kernel crate, no plane, no sibling auth-kind plugin.
# Every version is the workspace table's (busbar's at the pin).
[dependencies]
busbar-contract = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Key material and token bodies are wiped on drop (BUSBAR-1.6.0.md THE DESIGN §6: "auth material is
# zeroised").
zeroize = { workspace = true }
sha2 = { workspace = true }
# The plugin's log: the SDK captures each call's `tracing` events into the plugin's own log.
tracing = { workspace = true }

[dev-dependencies]
# The token request forms are the chip's (`cred::FormBody`); the tests read the sealed bytes back
# (`test-seal`, dev-only) and hold them to `serde_urlencoded`'s.
busbar-contract = { workspace = true, features = ["test-seal"] }
serde_urlencoded = { workspace = true }
# The log double (`warn_capture::WarnCapture`): the refusal and outage events are read back.
busbar-test-kit = { workspace = true }
