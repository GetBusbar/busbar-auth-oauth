# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-oauth-plugin"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "First-party signed kind:auth plugin cdylib: the oauth auth module, packaged as a droppable busbar plugin. Drop the signed tarball into plugins/."

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what makes `cargo test` emit the cdylib the conformance test
# loads (a cdylib-only package builds a trivial test harness and never produces the library).
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-auth-oauth = { path = "../auth-oauth" }
busbar-contract = { workspace = true }

[dev-dependencies]
# busbar's published conformance suite and the door's own both-ways proof (`tests/conformance.rs`,
# moved from busbar's crates/busbar-auth-oauth) load the linked door and dlopen the built cdylib over
# busbar's REAL loader: dev-only, never in the shipped artifact.
busbar-plugin-loader = { workspace = true, features = ["conformance"] }
# `tests/conformance.rs`: the instance's tick schedule runs on a runtime, as the composition root
# runs it, and its token responses are JSON.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
