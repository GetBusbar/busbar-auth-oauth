# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-oauth-plugin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "First-party signed kind:auth plugin cdylib: the oauth auth, packaged as a droppable busbar plugin. Drop the signed tarball into plugins/."

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what makes `cargo test` emit the cdylib the conformance test
# loads (a cdylib-only package builds a trivial test harness and never produces the library).
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-auth-oauth = { path = "../auth-oauth" }
busbar-contract = { workspace = true }

[dev-dependencies]
# The conformance test loads the linked door and dlopens the built cdylib over busbar's REAL loader:
# dev-only, never in the shipped artifact.
busbar-plugin-loader = { workspace = true }
